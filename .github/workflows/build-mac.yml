# Builds the Mac installer (Bookshelf.dmg) on GitHub's Macs and publishes it on the
# repository's Releases page under "Mac installer" (a normal download link to share).
# GitHub only reads build recipes from this .github/workflows folder, so it has to live here;
# all it does is run installers/build_app.py.
#
# It runs by itself when app or installer files change on master, or by hand from the
# "Actions" tab > "Build Mac app" > "Run workflow".
name: Build Mac app

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "installers/**"
      - "requirements.txt"
      - ".github/workflows/build-mac.yml"

permissions:
  contents: write  # to publish the .dmg on the Releases page

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build, self-test and make Bookshelf.dmg
        run: python installers/build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Bookshelf-mac
          path: installers/mac/Bookshelf.dmg
      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-latest
          name: Mac installer
          body: |
            **Bookshelf for Mac** (M1 and newer). Download `Bookshelf.dmg`, open it and drag
            Bookshelf into Applications. The first time, open it via
            System Settings → Privacy & Security → Open Anyway.
          files: installers/mac/Bookshelf.dmg
          make_latest: true
