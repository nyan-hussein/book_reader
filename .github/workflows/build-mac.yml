# Builds the Mac installer (installers/mac/Bookshelf.dmg) on GitHub's Macs.
# GitHub only reads build recipes from this .github/workflows folder, so it has to live here;
# all it does is run installers/build_app.py.
#
# Run it from the repository's "Actions" tab > "Build Mac app" > "Run workflow".
# When it finishes, Bookshelf.dmg is under "Artifacts" on the run's page.
name: Build Mac app

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build, self-test and make Bookshelf.dmg
        run: python installers/build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Bookshelf-mac
          path: installers/mac/Bookshelf.dmg
